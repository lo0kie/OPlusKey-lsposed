org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# 配置缓存：把「这次构建要怎么跑」整份缓存下来，下次同样输入的调用直接跳过配置阶段。
#
#  收益：每次 `./gradlew` 省掉约 10~15 秒的配置（本项目两个模块、每模块三档变体，
#  配置阶段要给 6 个变体各建一套任务图）。改代码反复跑 `gate` 时这笔开销是纯亏的。
#
#  前提（已在本仓满足）：配置阶段不许出现「只在这一次成立」的取值。
#  这条以前不成立 —— `build_id` 原本走 `resValue`，取的是**配置期的本地时钟**，
#  一开缓存它就被冻成第一次那个时刻。现在它改成 `GenerateBuildId` 任务的产物（执行期取时间），
#  配置与执行各归各位，见 `app/build.gradle.kts` 里那个任务的说明。
#
#  注意：若哪天有人在配置阶段又引入了「读时钟 / 读随机数 / 读未声明为输入的环境变量」，
#  Gradle 会**明确报错**并指出是哪一行，不会静默算错 —— 这正是它能开的前提。
#  这里**不设** `org.gradle.configuration-cache.problems=warn`：那条会把「缓存不可用」降级成警告，
#  于是某天它悄悄退回普通构建、性能白白回退，而 CI 仍然是绿的。与本仓其它闸同一条纪律：
#  该响的就让它响。
org.gradle.configuration-cache=true

# AGP 官方只认到 compileSdk 36，而 `libxposed:api:102.0.0` 要求 `minCompileSdk=37`，压掉该警告。
# `37,37.0` 两个都要写：AGP 把「37」与「37.0」各报一次
android.suppressUnsupportedCompileSdk=37,37.0
android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
