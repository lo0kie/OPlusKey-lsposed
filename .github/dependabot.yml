version: 2

# 依赖与 Action 的更新提醒。
#
#  两个生态分开配：Gradle 依赖（COUI / haze / libxposed / 图标库）按周看，
#  GitHub Actions 的版本按周看 —— 后者常因为「用旧版 action」被静默弃用。
#
#  分组（groups）是关键：不分组的 dependabot 会为每个依赖开一个 PR，
#  这个仓库一共 11 个依赖，一周能堆出十来个 PR 没人看。分组后一个 PR 一次升完，
#  真跑不动就整体回退，不会出现「升了 A 结果要配 B」的半吊子状态。
#
#  ⚠️ 本项目开了 Gradle 依赖锁定（`app/gradle.lockfile` + `core/gradle.lockfile`），而
#  **dependabot 不跑 Gradle** —— 它只改 `build.gradle.kts` 里的版本号，锁文件不会动。
#  所以每一个自动升级 PR 都必然在 CI 的「校验依赖锁定」那一步红灯，这不是故障，是设计：
#  **收到 PR 之后本地跑 `./gradlew :app:dependencies --write-locks` 与
#  `./gradlew :core:dependencies --write-locks`，把两份锁文件的 diff 一并提交**，
#  那条 PR 才会转绿。别把校验放宽成 warn —— 锁文件一旦漂了，构建就不再可复现。
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      gradle-plugins:
        patterns:
          - "*gradle*"
          - "com.android.*"
          - "org.jetbrains.kotlin*"
        update-types:
          - minor
          - patch
      gradle-libraries:
        patterns:
          - "*"
        exclude-patterns:
          - "com.android.*"
          - "org.jetbrains.kotlin*"
        update-types:
          - minor
          - patch
    # 大版本单独放行：AGP / Kotlin 的 major 升级必然带契约变化（比如 AGP 9 内置 Kotlin），
    # 不能混在「顺手升一下」那批里。
    ignore:
      - dependency-name: "com.android.tools.build:gradle"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
