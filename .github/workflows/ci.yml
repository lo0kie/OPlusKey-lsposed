name: 构建 APK

# 列表里那条 run 的标题。不写的话 GitHub 默认取**触发它的提交信息** —— 推 master 与推 tag 是同一个
# 提交，两条 run 的标题就会一模一样（一个构建一个发布），分不出谁是谁。
run-name: 构建 · ${{ github.ref_name }}

# 这一条只管「构建 + 验证 + 留产物」，**没有任何发布步骤** —— 发版在 `release.yml`（tag 触发），
# 它按提交 SHA 取这里的产物去发。两条 workflow 各管一段，于是推 master 的 run 图里不会再挂着
# 一个恒为 skipped 的 release job。

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: debug + release
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.dist.outputs.version_name }}
      version_code: ${{ steps.dist.outputs.version_code }}
      build_id: ${{ steps.dist.outputs.build_id }}
      tag: ${{ steps.dist.outputs.tag }}
      signed: ${{ steps.sign.outputs.signed }}

    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # CI 里别赌那次下载。
      - name: 装 JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"

      # compileSdk = 37 对应 `platforms;android-37.0`（Android 17 带小版本，目录也带）。
      - name: 装 Android SDK（platform 37.0 / build-tools 36.0.0）
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      # 没有 keystore 就不出 release：封存层（`core/build.gradle.kts` 的 `SealReleaseAssets`）
      # 要签名派生密钥、没有明文回退 —— 拿不到 keystore 那一步必然失败。
      # 与其让构建去撞墙，不如这里就说清「这一轮不出 release」。
      - name: 写入正式签名
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::notice title=未配置签名密钥::只构建 debug；release 需要正式签名（封存层没有明文回退）"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > keystore.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # 静态检查放在出包**之前**：格式 / 静态检查 / Android Lint 三道闸不过就别往下走，
      # 不必等到打完两个包才发现少一个空格。`gate` 是根脚本注册的聚合任务
      # （= `spotlessCheck detekt lintDebug`，两个模块一起算），与本地同一条命令（AGENTS.md 二、1.2）。
      #
      #  构建期那条 Gradle 弃用警告来自 **detekt 自己的 Gradle 插件**：`DetektPlugin.apply`
      #  一进来就调 `ReportingExtension.file(...)`（Gradle 9 起弃用，Gradle 10 删除）。
      #  1.23.8 已是最新稳定版、上游修复只在未发布的 2.0，项目侧无法规避 ——
      #  所以把**只有这一条**记为已知项放行；换成白名单而不是关警告：
      #  之后任何**新的**弃用都会让这一步失败（关掉 `--warning-mode` 就等于连回归一起盖住）。
      - name: 静态检查（格式化 / detekt / lint）
        run: |
          set -o pipefail
          log="${RUNNER_TEMP:-/tmp}/gate.log"
          ./gradlew gate --warning-mode all 2>&1 | tee "$log"
          extra=$(grep -i "has been deprecated" "$log" \
                  | grep -v "ReportingExtension.file(String)" || true)
          if [ -n "$extra" ]; then
            echo "::error::出现了新的 Gradle 弃用用法（已知的那条只有 detekt 的 ReportingExtension.file）"
            echo "$extra"
            exit 1
          fi

      # 依赖锁定（`app/gradle.lockfile` 已入库，开关见根目录 `build.gradle.kts`）。
      #
      #  为什么这道闸要卡在 CI：改了 `dependencies { }` 却忘了重新锁时，**本地照样编得过**
      #  —— Gradle 对「没进锁文件的那条配置」是宽松的（按解析结果走），只有把锁文件重写一遍
      #  才看得出来版本变了。于是同一份源码、下周出出来的包，传递依赖可能换了个补丁版本，
      #  而这个模块的界面跑在别人的进程里，线上只看得到行为差异、看不到依赖表。
      #
      #  判据是「重写一遍锁文件，然后看它有没有变」—— 不是「有没有锁」。
      - name: 校验依赖锁定
        run: |
          ./gradlew :app:dependencies :core:dependencies --write-locks -q > /dev/null
          if ! git diff --quiet -- app/gradle.lockfile core/gradle.lockfile; then
            git --no-pager diff -- app/gradle.lockfile core/gradle.lockfile | head -80
            echo "::error::app/gradle.lockfile 或 core/gradle.lockfile 与声明的依赖不一致 ——"\
                 "本地跑 ./gradlew :app:dependencies :core:dependencies --write-locks 后把锁文件一起提交"
            exit 1
          fi
          echo "锁文件与声明的依赖一致（app $(grep -c '=' app/gradle.lockfile) 条 / core $(grep -c '=' core/gradle.lockfile) 条）"

      # 耦合审计（docs/decoupling.md 七）：包级导入图 + 禁止边 + 环检测。
      # 这道闸补的是上面那三步看不见的东西 —— detekt / lint 管单文件，管不了
      # 「注入侧 import 了界面层」「core 反过来引 ui」这类**跨包越界**。
      # 脚本是纯标准库的，ubuntu 上装好的 python3 直接能跑。
      - name: 耦合审计（禁止边 / 包级环）
        run: python3 tools/audit-coupling.py

      # 架构判据（趋势线）：耦合审计管**包与包之间**的方向，管不了「同一条业务规则在几个地方
      #   各写了一遍」—— 包依赖图完全干净的时候，一条规则仍然可能有四五份手写实现，而漏改
      #   其中一处的表现是「某条路径上行为不一致」，编译期与 detekt 都看不见。
      #   这一步只打印不阻断（数值稳定之后再改成 `--strict`），目的是让「规则副本数」出现在
      #   每次 CI 日志里，改坏了当场看得见。
      - name: 架构判据（规则副本数 / 规模趋势）
        run: python3 tools/audit-arch.py

      # i18n 缓存审计：`remember { … }` 里缓存了字典文案、键里却没有语言档 ⇒ 切语言后那几行
      #   还是旧语言（真机上「关于」页那两行这么踩过）。detekt / lint 管不了这种跨语句的判据。
      #   与耦合审计同一条纪律：脚本存在的意义就是被跑，挂在 CI 上而不是靠人记得。
      - name: i18n 缓存审计
        run: python3 tools/check-i18n-cache.py

      # i18n 兜底一致性：每处 `I18n.get(Strings.X, "兜底")` 的兜底串**必须**与字典里的值逐字相同
      #   —— 字典没载入时显示的就是兜底那句，两边分叉等于同一件事有两套说法（真机上就出现过
      #   「需重启 / 需要重启」「确定 / 确认」这种两种口径都活着的情况）。377 处兜底，靠人看不住。
      - name: i18n 兜底一致性
        run: python3 tools/check-i18n-fallbacks.py

      # 补丁产物完整性：`patches/repo` 里那个 aar 是打完补丁重新发布的，不在任何上游仓库里，
      #   也没有上游签名可对 —— 仓库里那份就是唯一来源。校验和缺了 / 对不上，说明它被换过或传坏了。
      - name: 校验补丁产物
        run: bash tools/verify-patches.sh

      # 每一轮都打整包（debug + release + releaseLog）：这三个包既是验证对象，也是 `release.yml`
      #   发版时要取的那一份，还是出问题时能直接下来复现的那一份。
      #
      #  `releaseLog` = 正式签名 + R8 + 封存，只把 `VERBOSE_LOG` 那一档换成 true（见
      #   `app/build.gradle.kts` 的 buildTypes）。给用户排查用：出问题的人装它、抓日志，
      #   行为与正式包完全一致，只是多写日志。
      - name: 构建 debug / release / releaseLog
        run: |
          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
            ./gradlew assembleDebug assembleRelease assembleReleaseLog
          else
            ./gradlew assembleDebug
          fi

      # 三个版本值由 `tools/read-version.sh` 读（`release.yml` 调的是同一个脚本 —— 一处实现，
      #   不会两边漂）。抓不到就 fail，绝不兜底：兜底会发出一个 tag 叫 `0-0.0.0` 的 release，
      #   而模块仓库的机器人是从 APK 的二进制清单读真值算 tag 的，两边不一致时它会再改一次 tag。
      - name: 抓版本号
        id: dist
        run: bash tools/read-version.sh

      - name: 收产物到 dist
        run: |
          mkdir -p dist
          # 文件名按 **versionName**（用户认的是这个），不按 BUILD_ID —— 后者是 `GenerateBuildId` 的产物
          #  手写常量，忘了更新时产物名会停在上一版（`oplus-key-2026-10-15-0001-release.apk` 就是这么来的）。
          cp app/build/outputs/apk/debug/app-debug.apk     "dist/oplus-key-${{ steps.dist.outputs.version_name }}-debug.apk"
          # 没签名那一轮没有 release 产物，别在这儿报错（封存那一步已经挡在前面了）
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/oplus-key-${{ steps.dist.outputs.version_name }}-release.apk"
          fi
          # 「带完整日志的正式包」：同样只在签名那一轮才有（它沿用 release 的签名与封存）
          if [ -f app/build/outputs/apk/releaseLog/app-releaseLog.apk ]; then
            cp app/build/outputs/apk/releaseLog/app-releaseLog.apk "dist/oplus-key-${{ steps.dist.outputs.version_name }}-releaseLog.apk"
          fi
          ls -l dist

      # 两档 APK 的区分度（`tools/check_variants.py`）：详细日志 / 调试通道 / 明文收款码 /
      #   封存资产必须**只在各自那一档**出现。原先这个脚本既不在 gate 也不在 CI，
      #   等于「档配反了没人拦」—— 而 debug 档带着任意反射执行，串档是安全问题。
      #   只在签名那一轮跑：没签名就没有 release 产物，脚本会直接报「缺产物」。
      - name: 校验两档差异（debug / release）
        if: steps.sign.outputs.signed == 'true'
        run: python3 tools/check_variants.py

      # 验收底线：脚本在 `tools/verify-apk.sh`，`release.yml` 发版前也调它 —— 一套判据一处实现。
      - name: 校验验收底线（AGENTS.md 二、1.2）
        run: bash tools/verify-apk.sh dist

      - name: 上传 debug 产物
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: oplus-key-debug-${{ steps.dist.outputs.version_name }}
          path: dist/*-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: 上传 release 产物
        # 这份产物是 `release.yml` 发版时按 SHA 取的（保留 90 天）；没签名那一轮压根没有 release
        # 包（见 `signed` 那一步），这时上传会空手报错，故仍需这个条件。
        if: steps.sign.outputs.signed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: oplus-key-release-${{ steps.dist.outputs.version_name }}
          # 两个正式签名的包一起存：`release.yml` 发版时都要（模块仓库里挂 release，
          #  存档仓库里挂全部），按同一个 artifact 取才不会两趟。
          path: |
            dist/*-release.apk
            dist/*-releaseLog.apk
          if-no-files-found: error
          retention-days: 90

      # 崩溃栈还原全靠它：release 开了 R8，抓到的栈是 `a.a.b` 这种，
      # 没有 mapping 只能靠猜。与 APK 分开存、保留更久（90 天），
      # 按版本号对齐 —— 用户报的那一版能不能还原，就看这份文件在不在。
      - name: 上传混淆映射
        if: steps.sign.outputs.signed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: oplus-key-mapping-${{ steps.dist.outputs.version_name }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 90
