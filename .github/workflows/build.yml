name: 构建 APK

on:
  push:
    branches: [master, main]
    # `[0-9]*-*` 是 Xposed-Modules-Repo 的 tag 规范（<versionCode>-<versionName>）；
    # `v*` 是随手打的版本标签，两种都触发。发出去的 tag 由 build job 从版本号算出。
    tags: ["v*", "[0-9]*-*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: debug + release
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.dist.outputs.version_name }}
      version_code: ${{ steps.dist.outputs.version_code }}
      build_id: ${{ steps.dist.outputs.build_id }}
      tag: ${{ steps.dist.outputs.tag }}
      signed: ${{ steps.sign.outputs.signed }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # 必须 21：compileOptions 与 jvmTarget 都是 21；本机能过是靠 Gradle 自动下发 21 toolchain，
      # CI 里别赌那次下载。
      - name: 装 JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # compileSdk = 37 对应 `platforms;android-37.0`（Android 17 带小版本，目录也带）。
      - name: 装 Android SDK（platform 37.0 / build-tools 36.0.0）
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;36.0.0"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v6

      # 没配签名密钥时**只出 debug**：release 的收款码与名单是**封存**的（见 `app/build.gradle.kts`
      # 的 `SealReleaseAssets`），密钥由签名证书派生、且没有明文回退 —— 拿不到 keystore 那一步
      # 必然失败。与其让构建去撞墙，不如这里就说清「这一轮不出 release」。
      - name: 写入正式签名
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::notice title=未配置签名密钥::只构建 debug；release 需要正式签名（封存层没有明文回退）"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > keystore.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # 静态检查放在出包**之前**：格式 / 静态检查 / Android Lint 三道闸不过就别往下走，
      # 不必等到打完两个包才发现少一个空格。`gate` 是根脚本注册的聚合任务
      # （= `spotlessCheck detekt lintDebug`，两个模块一起算），与本地同一条命令（AGENTS.md 二、1.2）。
      - name: 静态检查（格式化 / detekt / lint）
        run: ./gradlew gate

      # 依赖锁定（`app/gradle.lockfile` 已入库，开关见根目录 `build.gradle.kts`）。
      #
      #  为什么这道闸要卡在 CI：改了 `dependencies { }` 却忘了重新锁时，**本地照样编得过**
      #  —— Gradle 对「没进锁文件的那条配置」是宽松的（按解析结果走），只有把锁文件重写一遍
      #  才看得出来版本变了。于是同一份源码、下周出出来的包，传递依赖可能换了个补丁版本，
      #  而这个模块的界面跑在别人的进程里，线上只看得到行为差异、看不到依赖表。
      #
      #  判据是「重写一遍锁文件，然后看它有没有变」—— 不是「有没有锁」。
      - name: 校验依赖锁定
        run: |
          ./gradlew :app:dependencies :core:dependencies --write-locks -q > /dev/null
          if ! git diff --quiet -- app/gradle.lockfile core/gradle.lockfile; then
            git --no-pager diff -- app/gradle.lockfile core/gradle.lockfile | head -80
            echo "::error::app/gradle.lockfile 或 core/gradle.lockfile 与声明的依赖不一致 ——"\
                 "本地跑 ./gradlew :app:dependencies :core:dependencies --write-locks 后把锁文件一起提交"
            exit 1
          fi
          echo "锁文件与声明的依赖一致（app $(grep -c '=' app/gradle.lockfile) 条 / core $(grep -c '=' core/gradle.lockfile) 条）"

      # 耦合审计（docs/decoupling.md 七）：包级导入图 + 禁止边 + 环检测。
      # 这道闸补的是上面那三步看不见的东西 —— detekt / lint 管单文件，管不了
      # 「注入侧 import 了界面层」「core 反过来引 ui」这类**跨包越界**。
      # 脚本是纯标准库的，ubuntu 上装好的 python3 直接能跑。
      - name: 耦合审计（禁止边 / 包级环）
        run: python3 tools/audit-coupling.py

      - name: 构建 debug / release
        run: |
          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
            ./gradlew assembleDebug assembleRelease
          else
            ./gradlew assembleDebug
          fi

      # 三个版本值一律从源码里正则抓，抓不到就 fail —— 绝不兜底。
      # 原先的兜底（unknown / 0.0.0 / 0）会让 job 照常跑完，再发出一个 tag 叫 `0-0.0.0` 的
      # release；而模块仓库的机器人是从 APK 的二进制清单读真值算 tag 的，两边不一致它就再改
      # 一次 tag，模块仓库里凭空多一个 tag，且没人会注意到版本号根本没进包。
      # 这三行必须是字面量：改成 `versionCode = base + 1` 这类表达式，正则就抓不到了。
      - name: 整理产物
        id: dist
        run: |
          BUILD_ID=$(sed -n 's/.*BUILD_ID[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
            core/src/main/java/com/lookie/opluskey/core/ModuleInfo.kt | head -1)
          VERSION_NAME=$(sed -n 's/.*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
            app/build.gradle.kts | head -1)
          VERSION_CODE=$(sed -n 's/.*versionCode[[:space:]]*=[[:space:]]*\([0-9]\+\).*/\1/p' \
            app/build.gradle.kts | head -1)

          # 校验必须留在这一层：把它塞进抓取用的函数会在 $(…) 子 shell 里跑，
          # 变量赋值传不出来，守卫会静默失效。
          missing=""
          [ -n "$BUILD_ID" ]     || missing="${missing}${missing:+、}BUILD_ID（core/src/main/java/com/lookie/opluskey/core/ModuleInfo.kt）"
          [ -n "$VERSION_NAME" ] || missing="${missing}${missing:+、}versionName（app/build.gradle.kts）"
          [ -n "$VERSION_CODE" ] || missing="${missing}${missing:+、}versionCode（app/build.gradle.kts）"
          if [ -n "$missing" ]; then
            echo "::error::抓不到 ${missing}；不要把空的版本值发出去（会建成 0-0.0.0 的 tag）"
            exit 1
          fi
          mkdir -p dist
          # 文件名按 **versionName**（用户认的是这个），不按 BUILD_ID —— 后者是源码里那个
          #  手写常量，忘了更新时产物名会停在上一版（`oplus-key-2026-10-15-0001-release.apk` 就是这么来的）。
          cp app/build/outputs/apk/debug/app-debug.apk     "dist/oplus-key-${VERSION_NAME}-debug.apk"
          # 没签名那一轮没有 release 产物，别在这儿报错（封存那一步已经挡在前面了）
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/oplus-key-${VERSION_NAME}-release.apk"
          fi
          echo "build_id=${BUILD_ID}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=${VERSION_CODE}-${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "版本 ${VERSION_NAME}（${VERSION_CODE}），构建 ${BUILD_ID}"
          ls -l dist

      # 验收底线在 CI 里前置把关：这些是模块能否被 LSPosed 识别、会不会弄崩 system_server 的硬条件。
      - name: 校验验收底线（AGENTS.md 二、1.2）
        run: |
          set -u
          fail=0
          bad() { echo "::error::$1"; fail=1; }

          for apk in dist/*.apk; do
            echo "校验 $apk"
            listing=$(unzip -l "$apk")

            # (1) META-INF/xposed 三件套齐全（LSPosed 的识别与上架校验都靠它们）
            for f in java_init.list scope.list module.prop; do
              if printf '%s' "$listing" | grep -q "META-INF/xposed/$f"; then
                echo "  ok  META-INF/xposed/$f"
              else
                bad "$apk 缺 META-INF/xposed/$f"
              fi
            done

            # (2) scope.list 首行必须是 system —— 写成 android 的话模块装了也不注入 system_server
            scope=$(unzip -p "$apk" META-INF/xposed/scope.list | head -1 | tr -d '\r')
            if [ "$scope" = "system" ]; then
              echo "  ok  scope.list 首行 = system"
            else
              bad "$apk 的 scope.list 首行须为 system（实际 '$scope'）"
            fi

            # (3) module.prop 同时含 minApiVersion= 与 targetApiVersion=（上架机器人按这两条校验）
            prop=$(unzip -p "$apk" META-INF/xposed/module.prop | tr -d '\r')
            for k in minApiVersion targetApiVersion; do
              if printf '%s\n' "$prop" | grep -q "^${k}="; then
                echo "  ok  module.prop 有 ${k}"
              else
                bad "$apk 的 module.prop 缺 ${k}="
              fi
            done

            # (4) 编译后的清单必须零入口 Activity（有 Activity 就会让 LSPosed 管理器亮出「打开模块」FAB）。
            #    只能查 APK 里的二进制清单：源清单的注释会被 merger 抄进合并清单，按字面查会误报。
            #    注意：判据要盖住**所有**入口写法（一、6「一条都不能有」）：
            #      · 模块设置入口：`MODULE_SETTINGS`
            #      · 启动器可见：`android.intent.category.LAUNCHER` / `…category.INFO`
            #        （`CATEGORY_INFO` 是「在启动器里露一条信息条目」，同样是入口）
            #      · 裸 `activity` / `activity-alias` 元素名 —— 清单里只要出现这两个标签，
            #        就说明声明了组件（AXML 的字符串池按行输出，故用整行精确匹配，
            #        不会误伤 `MainActivity` 这种以 Activity 结尾的类名）。
            if command -v strings >/dev/null 2>&1; then
              entry=$(unzip -p "$apk" AndroidManifest.xml | strings -e l \
                | grep -cE 'MODULE_SETTINGS|android\.intent\.category\.LAUNCHER|android\.intent\.category\.INFO|^activity$|^activity-alias$' || true)
              if [ "$entry" = "0" ]; then
                echo "  ok  清单零入口 Activity（无 MODULE_SETTINGS / LAUNCHER / INFO / activity 标签）"
              else
                bad "$apk 的清单里出现了入口标记（${entry} 处）：MODULE_SETTINGS / LAUNCHER / INFO / activity 标签"
              fi
            else
              # 没有 strings 就查不了，必须报错而非静默放过
              bad "runner 上没有 strings（binutils），清单入口这项没法校验"
            fi

            # (6) java_init.list 声明的入口类必须**真的在 dex 里**：
            #    类改名 / 挪包之后 CI 原来照样全绿发版，而框架按名字实例化会失败 ——
            #    现象是「模块已启用、日志一行都没有」（见 AGENTS.md 五之二、0）。
            #    类名在 dex 里是类型描述符 `Lcom/lookie/opluskey/KeyModule;`；多 dex 时全扫。
            entry_cls=$(unzip -p "$apk" META-INF/xposed/java_init.list | head -1 | tr -d '\r')
            if [ -z "$entry_cls" ]; then
              bad "$apk 的 java_init.list 是空的"
            else
              desc="L$(printf '%s' "$entry_cls" | tr '.' '/');"
              if unzip -p "$apk" 'classes*.dex' 2>/dev/null | strings | grep -qF "$desc"; then
                echo "  ok  java_init.list 的 $entry_cls 在 dex 里"
              else
                bad "$apk 的 java_init.list 声明了 $entry_cls，但 dex 里找不到 $desc"
              fi
            fi

            # (7) 作用域必须是构建期写死的那一档（`staticScope=true`）—— 一、9 说的
            #    「作用域写错 = 模块全绿但日志一行都没有」正是它守的东西。
            if printf '%s\n' "$prop" | grep -q '^staticScope=true$'; then
              echo "  ok  module.prop 有 staticScope=true"
            else
              bad "$apk 的 module.prop 缺 staticScope=true（作用域没写死 ⇒ 由用户在管理器里选）"
            fi

            # (8) scope.list 里的宿主包名必须与 `core/model/HostApp.kt` 的 `PACKAGE` 一致。
            #    scope.list 是资源文件，读不到 Kotlin 常量（那边用 `HostApp` 一处定义、代码全引它），
            #    所以只能在这里对一次账：两处不一致时模块装了、启用了、状态全绿，
            #    而设置页那一段**一行日志都没有**（一、9），从日志上看不出漏在哪一层。
            hostapp="core/src/main/java/com/lookie/opluskey/core/model/HostApp.kt"
            scope_host=$(unzip -p "$apk" META-INF/xposed/scope.list | sed -n '2p' | tr -d '\r')
            if [ -f "$hostapp" ]; then
              src_host=$(grep -oE 'const val PACKAGE = "[^"]+"' "$hostapp" | head -1 | sed 's/.*"\(.*\)"/\1/')
              if [ -z "$src_host" ]; then
                bad "从 $hostapp 里没读到 const val PACKAGE（这条校验会失效）"
              elif [ "$scope_host" = "$src_host" ]; then
                echo "  ok  scope.list 的宿主包名 = HostApp.PACKAGE（$src_host）"
              else
                bad "$apk 的 scope.list 第 2 行 '$scope_host' ≠ HostApp.PACKAGE '$src_host'"
              fi
            else
              bad "找不到 $hostapp（包名挪过？这条校验会失效）"
            fi

            # (9) 模块自己的包名也是两处硬编码：`core/model/ModuleInfo.PACKAGE` 与 `applicationId`。
            #    写错的表现是「按包名查自己的 APK」落空 —— 版本行空着、字典退回键名（宿主侧文案
            #    显示成 `catalog.flashlight` 这种），而两处互不相识、编译期不会报错。
            mi="core/src/main/java/com/lookie/opluskey/core/ModuleInfo.kt"
            appid=$(grep -oE 'applicationId = "[^"]+"' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)"/\1/')
            if [ -f "$mi" ]; then
              mi_pkg=$(grep -oE 'const val PACKAGE = "[^"]+"' "$mi" | head -1 | sed 's/.*"\(.*\)"/\1/')
              if [ -z "$appid" ] || [ -z "$mi_pkg" ]; then
                bad "没读到 applicationId（'$appid'）或 ModuleInfo.PACKAGE（'$mi_pkg'），这条校验会失效"
              elif [ "$appid" = "$mi_pkg" ]; then
                echo "  ok  ModuleInfo.PACKAGE = applicationId（$appid）"
              else
                bad "ModuleInfo.PACKAGE '$mi_pkg' ≠ applicationId '$appid'"
              fi
            else
              bad "找不到 $mi（包名挪过？这条校验会失效）"
            fi
          done

          # (5) 注入侧不得引用 androidx / COUI / 图标库 / 界面层 —— 那些类在 system_server 里
          #    执行会在类加载期崩。判据是「这个类会不会在 system_server 里被执行」：inject/ 是
          #    注入侧本体，core/ 是它依赖的共享层（同样在注入目标进程里执行），所以一并拦；
          #    注意：debug / release 源集里也有 `core/` 的副本（`HostFilePerms`），同样在注入侧执行，
          #    一并扫。
          #    ui/（Compose + COUI）与图标库（com.composables / io.github.lyxnx）是禁引项。
          #    bridge/ 是 2026-10-16 从 inject/ 拆出的「两进程共用的平台层」（系统桥 / 事实表 /
          #    按键注入）：两侧共用、也在 system_server 里被加载，所以与 core/ 同待遇，一并拦。
          #    ⚠️ 2026-10-17 起 bridge/ 又按**进程归属**分了三档：`bridge/`（两侧共用）、
          #    `bridge/host/`（只有宿主侧引用）、`bridge/inject/`（只有注入侧引用）。
          #    `bridge/host/` **不在这条扫描范围内** —— 它只在宿主 App 进程里跑，与 `host/` 同待遇
          #    （拿它跟 system_server 一起拦会把宿主侧也当成注入侧，判据就错了）。
          #    目录先各自确认存在：路径写错时 grep 会返回 2（错误），不加这道守卫会被当成「无命中」放过
          injection_dirs=""
          for p in \
            app/src/main/java/com/lookie/opluskey/inject \
            app/src/main/java/com/lookie/opluskey/bridge \
            core/src/main/java/com/lookie/opluskey \
            core/src/debug/java/com/lookie/opluskey \
            core/src/release/java/com/lookie/opluskey ; do
            if [ -d "$p" ]; then
              injection_dirs="$injection_dirs $p"
            else
              bad "找不到注入侧目录 $p（包名挪过？这条校验会失效）"
            fi
          done
          if [ ! -d app/src/main/java/com/lookie/opluskey/bridge/host ]; then
            bad "找不到 bridge/host/（进程归属分过档？这条 --exclude-dir=host 的排除会失效）"
          fi
          hits=$(grep -rn --exclude-dir=host "^import \(androidx\|io\.github\.suqi8\|io\.github\.lyxnx\|com\.composables\|com\.lookie\.opluskey\.ui\b\|com\.lookie\.opluskey\.ui\." $injection_dirs || true)
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            bad "注入侧（inject/ bridge/ core/，不含 bridge/host/）引用了 androidx / COUI —— 见 AGENTS.md 一、1"
          else
            echo "  ok  注入侧无 androidx / COUI import"
          fi

          # (5)' `KeyModule.kt` 单列一档：它在注入侧会被加载，但它
          #    **允许** import `ui/`（界面 hook 只在设置页那个进程分支里装，见它的类注释）
          #    —— 直接并进上面那圈扫描会误报。这里只禁「一加载就崩」的那三类。
          km="app/src/main/java/com/lookie/opluskey/KeyModule.kt"
          if [ -f "$km" ]; then
            kmhits=$(grep -n "^import \(androidx\|io\.github\.suqi8\|io\.github\.lyxnx\|com\.composables\)" "$km" || true)
            if [ -n "$kmhits" ]; then
              printf '%s\n' "$kmhits"
              bad "KeyModule.kt 引用了 androidx / COUI / 图标库 —— 它在 system_server 里会被加载"
            else
              echo "  ok  KeyModule.kt 无 androidx / COUI / 图标库 import"
            fi
          else
            bad "找不到 $km（包名挪过？这条校验会失效）"
          fi

          # (6) 字典覆盖：`Strings.kt` 里的每个键必须在**两份**字典里各有一条，且两份的键集合相同。
          #    为什么这条要卡在 CI：界面上的兜底是「查不到就显示键本身」（见 `I18n.get` 与
          #    `ActionCatalog.Spec.label`）—— 漏一条键，界面上就是一行 `catalog.xxx`，
          #    只在切到那种语言时才看得见；两份字典不一致时，另一种语言下露键名。
          strings_kt="core/src/main/java/com/lookie/opluskey/core/i18n/Strings.kt"
          zh="app/src/main/assets/locales/zh-CN.json"
          en="app/src/main/assets/locales/en.json"
          missing_file=""
          for f in "$strings_kt" "$zh" "$en"; do
            [ -f "$f" ] || missing_file="$missing_file $f"
          done
          if [ -n "$missing_file" ]; then
            bad "找不到字典文件：$missing_file（路径挪过？这条校验会失效）"
          else
            # 键的形态是 `小写字母 / 数字 / 点 / 下划线`，所以这一条正则只会抽到键，不会抽到 KDoc 里的散文
            k_src=$(grep -oE '"[a-z0-9_.]+"' "$strings_kt" | tr -d '"' | sort -u)
            k_zh=$(grep -oE '"[a-z0-9_.]+":' "$zh" | tr -d '":' | sort -u)
            k_en=$(grep -oE '"[a-z0-9_.]+":' "$en" | tr -d '":' | sort -u)
            miss_zh=$(comm -23 <(printf '%s\n' "$k_src") <(printf '%s\n' "$k_zh") || true)
            miss_en=$(comm -23 <(printf '%s\n' "$k_src") <(printf '%s\n' "$k_en") || true)
            extra_zh=$(comm -13 <(printf '%s\n' "$k_src") <(printf '%s\n' "$k_zh") || true)
            if [ -n "$miss_zh" ] || [ -n "$miss_en" ] || [ -n "$extra_zh" ]; then
              [ -n "$miss_zh" ] && printf 'zh-CN.json 缺键：\n%s\n' "$miss_zh"
              [ -n "$miss_en" ] && printf 'en.json 缺键：\n%s\n' "$miss_en"
              [ -n "$extra_zh" ] && printf '字典里有而 Strings.kt 没有的键：\n%s\n' "$extra_zh"
              bad "字典与 Strings.kt 对不上（界面会直接显示键名）"
            else
              echo "  ok  字典覆盖：Strings.kt / zh-CN.json / en.json 三边键一致（$(printf '%s\n' "$k_src" | wc -l | tr -d ' ') 条）"
            fi
          fi

          # (10) 封存：release 是「发布形态」—— 不许出现明文收款码 / 名单，且必须有容器；
          #    debug 反过来（它的图就是明文，靠 `app/seal` 那条 assets 目录进的包）。
          #    守的是「封存任务没跑起来 / 被绕过」——那种包照样能出、能装，只有把包解开才看得出来。
          for apk in dist/*-release.apk; do
            [ -f "$apk" ] || continue
            echo "校验封存 $apk"
            listing=$(unzip -l "$apk")
            if printf '%s' "$listing" | grep -qE 'assets/donate/|assets/donors\.json'; then
              printf '%s\n' "$listing" | grep -E 'assets/donate/|assets/donors\.json'
              bad "$apk 里有明文收款码 / 名单 —— 封存没生效"
            else
              echo "  ok  发布包里没有明文收款码 / 名单"
            fi
            if printf '%s' "$listing" | grep -q 'assets/sealed.bin'; then
              echo "  ok  发布包里有 assets/sealed.bin"
            else
              bad "$apk 缺 assets/sealed.bin（封存容器没生成）"
            fi
          done

          for apk in dist/*-debug.apk; do
            [ -f "$apk" ] || continue
            if unzip -l "$apk" | grep -q 'assets/donate/wechat.webp'; then
              echo "  ok  debug 包里是明文收款码（app/seal 那条资产目录接上了）"
            else
              bad "$apk 里没有 assets/donate/wechat.webp —— debug 的明文资产没接上"
            fi
          done

          if [ "$fail" != "0" ]; then
            echo "::error::验收底线未通过 —— 见上面的 ::error:: 条目"
            exit 1
          fi
          echo "验收底线全部通过"

      - name: 上传 debug 产物
        uses: actions/upload-artifact@v7
        with:
          name: oplus-key-debug-${{ steps.dist.outputs.version_name }}
          path: dist/*-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: 上传 release 产物
        # 没签名那一轮压根没有 release 包（见上面 `signed` 那条），这时上传会空手报错
        if: steps.sign.outputs.signed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: oplus-key-release-${{ steps.dist.outputs.version_name }}
          path: dist/*-release.apk
          if-no-files-found: error
          retention-days: 90

      # 崩溃栈还原全靠它：release 开了 R8，抓到的栈是 `a.a.b` 这种，
      # 没有 mapping 只能靠猜。与 APK 分开存、保留更久（90 天），
      # 按版本号对齐 —— 用户报的那一版能不能还原，就看这份文件在不在。
      - name: 上传混淆映射
        if: steps.sign.outputs.signed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: oplus-key-mapping-${{ steps.dist.outputs.version_name }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 90

  release:
    name: 发布到 Xposed-Modules-Repo
    needs: build
    # 注意：**只有打标签才发版**：原来只排除 PR，于是**每次推 master**
    #    也会走这一步，而 tag 是由 `versionCode-versionName` 算出来的 —— 版本号没涨时
    #    每次都覆盖同一个 tag（当前是 `1-1.0.0`），半成品就这么推给了用户。
    #    tag 由人来打（`v*` 或 `<versionCode>-<versionName>`，见上面的 on.tags）。
    #  也要 `signed`：没配签名密钥那一轮压根没有 release 包（见 build job 的 `写入正式签名`），
    #    没有产物就没得发 —— 与其让下载那几步空手报错，不如整个 job 跳过。
    if: startsWith(github.ref, 'refs/tags/') && needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # LSPosed 模块仓库由机器人按 applicationId 自动建；Release 必须发在那个仓库里，
      # 发在本仓库不算数（管理器只读模块仓库的 release）。
      MODULE_REPO: Xposed-Modules-Repo/io.github.lo0kie.opluskey
      # tag 规范固定为 <versionCode>-<versionName>，由 build job 从版本号读出；
      # 模块仓库的 tag 机器人也改成同一个值，两边一致才不会互相打架。
      TAG: ${{ needs.build.outputs.tag }}

    steps:
      # 模块仓库还没批下来 / 令牌还没配时不发版，只提示
      - name: 检查发布前置条件
        id: token
        env:
          MODULES_REPO_TOKEN: ${{ secrets.MODULES_REPO_TOKEN }}
          GH_TOKEN: ${{ secrets.MODULES_REPO_TOKEN }}
        run: |
          if [ -z "${MODULES_REPO_TOKEN:-}" ]; then
            echo "::notice title=未配置发布令牌::跳过发布；需在 Secrets 里加 MODULES_REPO_TOKEN（对 ${MODULE_REPO} 有 contents:write）"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 模块仓库由 XposedBot 在 issue 通过后才创建，未创建时下面每一步都会报错；
          # 先探一次，不存在就跳过。
          if ! gh repo view "$MODULE_REPO" >/dev/null 2>&1; then
            echo "::notice title=模块仓库尚不存在::跳过发布；${MODULE_REPO} 还没创建（提交 issue 通过后由机器人建）"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: 下载构建产物
        if: steps.token.outputs.ready == 'true'
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # 资产名按版本号，同一版重传会撞同名 —— 先清掉这一版已有资产再传，
      # 免得 `gh` 报「文件已存在」，也免得同一条 release 下攒出两个同名包。
      - name: 清掉这一版里的旧资产
        if: steps.token.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.MODULES_REPO_TOKEN }}
        run: |
          gh release view "$TAG" --repo "$MODULE_REPO" --json assets \
            --jq '.assets[].name' 2>/dev/null | while read -r name; do
            [ -n "$name" ] || continue
            echo "删除旧资产 $name"
            gh release delete-asset "$TAG" "$name" --repo "$MODULE_REPO" --yes
          done

      # 只传 release 包：机器人按单个 apk URL 处理，挂两个抓不准；debug 包另以 Actions artifact 保留。
      #
      # 预发布版本靠「预发布」这一个标记区分，没有第二套构建：
      #   versionName 里带 `-`（如 1.1.0-beta.1）⇒ 发为预发布 ⇒ 只进管理器的「测试版」通道。
      #   索引据此填 `latestBetaRelease`（稳定版填 `latestRelease`、快照版按 release 标题前缀填
      #   `latestSnapshotRelease`），管理器的「稳定版」通道会把 `isPrerelease` 的条目整个滤掉。
      # 注意：版本号仍须单调递增：预发布也占一个 `versionCode`，不涨的话测试通道收不到更新提示。
      - name: 建 / 更新 Release
        if: steps.token.outputs.ready == 'true'
        uses: softprops/action-gh-release@v3
        with:
          repository: ${{ env.MODULE_REPO }}
          token: ${{ secrets.MODULES_REPO_TOKEN }}
          tag_name: ${{ env.TAG }}
          name: ${{ needs.build.outputs.version_name }}
          prerelease: ${{ contains(needs.build.outputs.version_name, '-') }}
          # 预发布不能被设为 latest（GitHub 会拒），所以这一项和上面反着来。
          make_latest: ${{ !contains(needs.build.outputs.version_name, '-') }}
          # 只有一档包体（release，见 `app/build.gradle.kts` 的 buildTypes）：预发布与正式
          #   发的是同一个包，区别只在 `prerelease` 那个标记上。
          files: dist/*-release.apk
          body: |
            `versionName` = ${{ needs.build.outputs.version_name }}，`versionCode` = ${{ needs.build.outputs.version_code }}，`BUILD_ID` = ${{ needs.build.outputs.build_id }}。
            由 GitHub Actions 自动构建。
