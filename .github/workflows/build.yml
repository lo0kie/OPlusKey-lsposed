name: 构建 APK

on:
  push:
    branches: [master, main]
    # `[0-9]*-*` 是 Xposed-Modules-Repo 的 tag 规范（<versionCode>-<versionName>）；
    # `v*` 是随手打的版本标签，两种都触发。发出去的 tag 由 build job 从版本号算出。
    tags: ['v*', '[0-9]*-*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: debug + release
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.dist.outputs.version_name }}
      version_code: ${{ steps.dist.outputs.version_code }}
      build_id: ${{ steps.dist.outputs.build_id }}
      tag: ${{ steps.dist.outputs.tag }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # 必须 21：compileOptions 与 jvmTarget 都是 21；本机能过是靠 Gradle 自动下发 21 toolchain，
      # CI 里别赌那次下载。
      - name: 装 JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # compileSdk = 37 对应 `platforms;android-37.0`（Android 17 带小版本，目录也带）。
      - name: 装 Android SDK（platform 37.0 / build-tools 36.0.0）
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v6

      # 没配签名密钥也能跑通：release 自动退回 debug 签名，那种包不可发布。
      - name: 写入正式签名
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::notice title=未配置签名密钥::release 包退回 debug 签名，只能本机测试、不可发布"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > keystore.properties

      - name: 构建 debug 与 release
        run: ./gradlew assembleDebug assembleRelease

      # 三个版本值一律从源码里正则抓，抓不到就 fail —— 绝不兜底。
      # 原先的兜底（unknown / 0.0.0 / 0）会让 job 照常跑完，再发出一个 tag 叫 `0-0.0.0` 的
      # release；而模块仓库的机器人是从 APK 的二进制清单读真值算 tag 的，两边不一致它就再改
      # 一次 tag，模块仓库里凭空多一个 tag，且没人会注意到版本号根本没进包。
      # 这三行必须是字面量：改成 `versionCode = base + 1` 这类表达式，正则就抓不到了。
      - name: 整理产物
        id: dist
        run: |
          BUILD_ID=$(sed -n 's/.*BUILD_ID[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
            app/src/main/java/com/lookie/opluskey/KeyModule.kt | head -1)
          VERSION_NAME=$(sed -n 's/.*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
            app/build.gradle.kts | head -1)
          VERSION_CODE=$(sed -n 's/.*versionCode[[:space:]]*=[[:space:]]*\([0-9]\+\).*/\1/p' \
            app/build.gradle.kts | head -1)

          # 校验必须留在这一层：把它塞进抓取用的函数会在 $(…) 子 shell 里跑，
          # 变量赋值传不出来，守卫会静默失效。
          missing=""
          [ -n "$BUILD_ID" ]     || missing="${missing}${missing:+、}BUILD_ID（KeyModule.kt）"
          [ -n "$VERSION_NAME" ] || missing="${missing}${missing:+、}versionName（app/build.gradle.kts）"
          [ -n "$VERSION_CODE" ] || missing="${missing}${missing:+、}versionCode（app/build.gradle.kts）"
          if [ -n "$missing" ]; then
            echo "::error::抓不到 ${missing}；不要把空的版本值发出去（会建成 0-0.0.0 的 tag）"
            exit 1
          fi
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk     "dist/oplus-key-${BUILD_ID}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/oplus-key-${BUILD_ID}-release.apk"
          echo "build_id=${BUILD_ID}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=${VERSION_CODE}-${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "版本 ${VERSION_NAME}（${VERSION_CODE}），构建 ${BUILD_ID}"
          ls -l dist

      # 验收底线在 CI 里前置把关：这些是模块能否被 LSPosed 识别、会不会弄崩 system_server 的硬条件。
      - name: 校验验收底线（AGENTS.md 二、1.2）
        run: |
          set -u
          fail=0
          bad() { echo "::error::$1"; fail=1; }

          for apk in dist/*.apk; do
            echo "校验 $apk"
            listing=$(unzip -l "$apk")

            # (1) META-INF/xposed 三件套齐全（LSPosed 的识别与上架校验都靠它们）
            for f in java_init.list scope.list module.prop; do
              if printf '%s' "$listing" | grep -q "META-INF/xposed/$f"; then
                echo "  ok  META-INF/xposed/$f"
              else
                bad "$apk 缺 META-INF/xposed/$f"
              fi
            done

            # (2) scope.list 首行必须是 system —— 写成 android 的话模块装了也不注入 system_server
            scope=$(unzip -p "$apk" META-INF/xposed/scope.list | head -1 | tr -d '\r')
            if [ "$scope" = "system" ]; then
              echo "  ok  scope.list 首行 = system"
            else
              bad "$apk 的 scope.list 首行须为 system（实际 '$scope'）"
            fi

            # (3) module.prop 同时含 minApiVersion= 与 targetApiVersion=（上架机器人按这两条校验）
            prop=$(unzip -p "$apk" META-INF/xposed/module.prop | tr -d '\r')
            for k in minApiVersion targetApiVersion; do
              if printf '%s\n' "$prop" | grep -q "^${k}="; then
                echo "  ok  module.prop 有 ${k}"
              else
                bad "$apk 的 module.prop 缺 ${k}="
              fi
            done

            # (4) 编译后的清单必须零入口 Activity（有 Activity 就会让 LSPosed 管理器亮出「打开模块」FAB）。
            #    只能查 APK 里的二进制清单：源清单的注释会被 merger 抄进合并清单，按字面查会误报。
            #    注意：判据要盖住**所有**入口写法（一、6「一条都不能有」）：
            #      · 模块设置入口：`MODULE_SETTINGS`
            #      · 启动器可见：`android.intent.category.LAUNCHER` / `…category.INFO`
            #        （`CATEGORY_INFO` 是「在启动器里露一条信息条目」，同样是入口）
            #      · 裸 `activity` / `activity-alias` 元素名 —— 清单里只要出现这两个标签，
            #        就说明声明了组件（AXML 的字符串池按行输出，故用整行精确匹配，
            #        不会误伤 `MainActivity` 这种以 Activity 结尾的类名）。
            if command -v strings >/dev/null 2>&1; then
              entry=$(unzip -p "$apk" AndroidManifest.xml | strings -e l \
                | grep -cE 'MODULE_SETTINGS|android\.intent\.category\.LAUNCHER|android\.intent\.category\.INFO|^activity$|^activity-alias$' || true)
              if [ "$entry" = "0" ]; then
                echo "  ok  清单零入口 Activity（无 MODULE_SETTINGS / LAUNCHER / INFO / activity 标签）"
              else
                bad "$apk 的清单里出现了入口标记（${entry} 处）：MODULE_SETTINGS / LAUNCHER / INFO / activity 标签"
              fi
            else
              # 没有 strings 就查不了，必须报错而非静默放过
              bad "runner 上没有 strings（binutils），清单入口这项没法校验"
            fi

            # (6) java_init.list 声明的入口类必须**真的在 dex 里**：
            #    类改名 / 挪包之后 CI 原来照样全绿发版，而框架按名字实例化会失败 ——
            #    现象是「模块已启用、日志一行都没有」（见 AGENTS.md 五之二、0）。
            #    类名在 dex 里是类型描述符 `Lcom/lookie/opluskey/KeyModule;`；多 dex 时全扫。
            entry_cls=$(unzip -p "$apk" META-INF/xposed/java_init.list | head -1 | tr -d '\r')
            if [ -z "$entry_cls" ]; then
              bad "$apk 的 java_init.list 是空的"
            else
              desc="L$(printf '%s' "$entry_cls" | tr '.' '/');"
              if unzip -p "$apk" 'classes*.dex' 2>/dev/null | strings | grep -qF "$desc"; then
                echo "  ok  java_init.list 的 $entry_cls 在 dex 里"
              else
                bad "$apk 的 java_init.list 声明了 $entry_cls，但 dex 里找不到 $desc"
              fi
            fi

            # (7) 作用域必须是构建期写死的那一档（`staticScope=true`）—— 一、9 说的
            #    「作用域写错 = 模块全绿但日志一行都没有」正是它守的东西。
            if printf '%s\n' "$prop" | grep -q '^staticScope=true$'; then
              echo "  ok  module.prop 有 staticScope=true"
            else
              bad "$apk 的 module.prop 缺 staticScope=true（作用域没写死 ⇒ 由用户在管理器里选）"
            fi
          done

          # (5) 注入侧不得引用 androidx / COUI / 图标库 / 界面层 —— 那些类在 system_server 里
          #    执行会在类加载期崩。判据是「这个类会不会在 system_server 里被执行」：inject/ 是
          #    注入侧本体，core/ 是它依赖的共享层（同样在注入目标进程里执行），所以一并拦；
          #    注意：debug / release 源集里也有 `core/` 的副本（`HostFilePerms`），同样在注入侧执行，
          #    一并扫。
          #    ui/（Compose + COUI）与图标库（com.composables / io.github.lyxnx）是禁引项。
          #    目录先各自确认存在：路径写错时 grep 会返回 2（错误），不加这道守卫会被当成「无命中」放过
          injection_dirs=""
          for p in \
            app/src/main/java/com/lookie/opluskey/inject \
            app/src/main/java/com/lookie/opluskey/core \
            app/src/debug/java/com/lookie/opluskey/core \
            app/src/release/java/com/lookie/opluskey/core ; do
            if [ -d "$p" ]; then
              injection_dirs="$injection_dirs $p"
            else
              bad "找不到注入侧目录 $p（包名挪过？这条校验会失效）"
            fi
          done
          hits=$(grep -rn "^import \(androidx\|io\.github\.suqi8\|io\.github\.lyxnx\|com\.composables\|com\.lookie\.opluskey\.ui\b\|com\.lookie\.opluskey\.ui\." $injection_dirs || true)
          if [ -n "$hits" ]; then
            printf '%s\n' "$hits"
            bad "注入侧（inject/ core/）引用了 androidx / COUI —— 见 AGENTS.md 一、1"
          else
            echo "  ok  注入侧无 androidx / COUI import"
          fi

          # (5)' `KeyModule.kt` 单列一档：它在注入侧会被加载，但它
          #    **允许** import `ui/`（界面 hook 只在设置页那个进程分支里装，见它的类注释）
          #    —— 直接并进上面那圈扫描会误报。这里只禁「一加载就崩」的那三类。
          km="app/src/main/java/com/lookie/opluskey/KeyModule.kt"
          if [ -f "$km" ]; then
            kmhits=$(grep -n "^import \(androidx\|io\.github\.suqi8\|io\.github\.lyxnx\|com\.composables\)" "$km" || true)
            if [ -n "$kmhits" ]; then
              printf '%s\n' "$kmhits"
              bad "KeyModule.kt 引用了 androidx / COUI / 图标库 —— 它在 system_server 里会被加载"
            else
              echo "  ok  KeyModule.kt 无 androidx / COUI / 图标库 import"
            fi
          else
            bad "找不到 $km（包名挪过？这条校验会失效）"
          fi

          if [ "$fail" != "0" ]; then
            echo "::error::验收底线未通过 —— 见上面的 ::error:: 条目"
            exit 1
          fi
          echo "验收底线全部通过"

      - name: 上传 debug 产物
        uses: actions/upload-artifact@v7
        with:
          name: oplus-key-debug-${{ steps.dist.outputs.build_id }}
          path: dist/*-debug.apk
          if-no-files-found: error

      - name: 上传 release 产物
        uses: actions/upload-artifact@v7
        with:
          name: oplus-key-release-${{ steps.dist.outputs.build_id }}
          path: dist/*-release.apk
          if-no-files-found: error

  release:
    name: 发布到 Xposed-Modules-Repo
    needs: build
    # 注意：**只有打标签才发版**：原来只排除 PR，于是**每次推 master**
    #    也会走这一步，而 tag 是由 `versionCode-versionName` 算出来的 —— 版本号没涨时
    #    每次都覆盖同一个 tag（当前是 `1-1.0.0`），半成品就这么推给了用户。
    #    tag 由人来打（`v*` 或 `<versionCode>-<versionName>`，见上面的 on.tags）。
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # LSPosed 模块仓库由机器人按 applicationId 自动建；Release 必须发在那个仓库里，
      # 发在本仓库不算数（管理器只读模块仓库的 release）。
      MODULE_REPO: Xposed-Modules-Repo/io.github.lo0kie.opluskey
      # tag 规范固定为 <versionCode>-<versionName>，由 build job 从版本号读出；
      # 模块仓库的 tag 机器人也改成同一个值，两边一致才不会互相打架。
      TAG: ${{ needs.build.outputs.tag }}

    steps:
      # 模块仓库还没批下来 / 令牌还没配时不发版，只提示
      - name: 检查发布前置条件
        id: token
        env:
          MODULES_REPO_TOKEN: ${{ secrets.MODULES_REPO_TOKEN }}
          GH_TOKEN: ${{ secrets.MODULES_REPO_TOKEN }}
        run: |
          if [ -z "${MODULES_REPO_TOKEN:-}" ]; then
            echo "::notice title=未配置发布令牌::跳过发布；需在 Secrets 里加 MODULES_REPO_TOKEN（对 ${MODULE_REPO} 有 contents:write）"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 模块仓库由 XposedBot 在 issue 通过后才创建，未创建时下面每一步都会报错；
          # 先探一次，不存在就跳过。
          if ! gh repo view "$MODULE_REPO" >/dev/null 2>&1; then
            echo "::notice title=模块仓库尚不存在::跳过发布；${MODULE_REPO} 还没创建（提交 issue 通过后由机器人建）"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: 下载构建产物
        if: steps.token.outputs.ready == 'true'
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # 资产名带 BUILD_ID，重传不会覆盖同名文件 —— 先清掉这一版已有资产，
      # 否则同一 versionName 下每构建一次就多攒一个 APK。
      - name: 清掉这一版里的旧资产
        if: steps.token.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.MODULES_REPO_TOKEN }}
        run: |
          gh release view "$TAG" --repo "$MODULE_REPO" --json assets \
            --jq '.assets[].name' 2>/dev/null | while read -r name; do
            [ -n "$name" ] || continue
            echo "删除旧资产 $name"
            gh release delete-asset "$TAG" "$name" --repo "$MODULE_REPO" --yes
          done

      # 只传 release 包：机器人按单个 apk URL 处理，挂两个抓不准；debug 包另以 Actions artifact 保留。
      #
      # beta 版本靠「预发布」这一个标记区分，没有第二套流程：
      #   versionName 里带 `-`（如 1.1.0-beta.1）⇒ 发为预发布 ⇒ 只进管理器的「测试版」通道。
      #   索引据此填 `latestBetaRelease`（稳定版填 `latestRelease`、快照版按 release 标题前缀填
      #   `latestSnapshotRelease`），管理器的「稳定版」通道会把 `isPrerelease` 的条目整个滤掉。
      # 注意：版本号仍须单调递增：beta 也占一个 `versionCode`，不涨的话测试通道收不到更新提示。
      - name: 建 / 更新 Release
        if: steps.token.outputs.ready == 'true'
        uses: softprops/action-gh-release@v3
        with:
          repository: ${{ env.MODULE_REPO }}
          token: ${{ secrets.MODULES_REPO_TOKEN }}
          tag_name: ${{ env.TAG }}
          name: ${{ needs.build.outputs.version_name }}
          prerelease: ${{ contains(needs.build.outputs.version_name, '-') }}
          # 预发布不能被设为 latest（GitHub 会拒），所以这一项和上面反着来。
          make_latest: ${{ !contains(needs.build.outputs.version_name, '-') }}
          files: dist/*-release.apk
          body: |
            `versionName` = ${{ needs.build.outputs.version_name }}，`versionCode` = ${{ needs.build.outputs.version_code }}，`BUILD_ID` = ${{ needs.build.outputs.build_id }}。
            由 GitHub Actions 自动构建。
